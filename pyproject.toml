[project]
name = "defer-bench"
version = "0.1.0"
description = "Benchmark measuring visible and silent model fallback behavior on safety-guarded queries"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.34",
]
xai = [
    "openai>=1.0",
]
gemini = [
    "google-genai>=0.3",
]
ollama = [
    "openai>=1.0",
]
all = [
    "openai>=1.0",
    "anthropic>=0.34",
    "google-genai>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "scoring*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core correctness/style. I: import sorting.
# B: bugbear (catches real footguns like mutable default args).
select = ["E", "F", "I", "B"]
# Adapters intentionally catch broad Exception to retry/log any provider
# failure without coupling to a specific SDK's exception types (see
# harness/runner.py's `_generate_with_retry`); already commented inline.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
# openai/anthropic/google-genai are optional extras — don't fail
# type-checking for users who haven't installed them.
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["build/", "\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
